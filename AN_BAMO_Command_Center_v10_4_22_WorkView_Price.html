<script>
// v10.4.15 Flex & Discount — client discount (A), catalog visibility + add (B), owner catalog import (C).
// Additive layer: new state + DOM injection + wraps. Wrap not rewrite; cross-block via window; totals() untouched.
(function(){
  const VERSION_V1415='v10.4.15 Flex And Discount';
  document.title='AN BAMO Command Center v10.4.15 - Flex And Discount';
  if(typeof DEFAULT==='object')DEFAULT.version=VERSION_V1415;
  function n(v){return typeof num==='function'?num(v):(Number(String(v??0).replace(',','.'))||0)}
  function e(v){return typeof escHtml==='function'?escHtml(v):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function m(v){return typeof money==='function'?money(v):`${Math.round(n(v))} €`}

  /* ---------- styles ---------- */
  const css=`
  .v1415-disc{margin-top:var(--s3,12px);border:1px solid var(--brd,var(--line));border-radius:var(--r14,14px);background:var(--surface);padding:14px}
  .v1415-disc h3{margin:0 0 8px;font-size:var(--fs-md,14px);color:var(--txt,var(--ink))}
  .v1415-disc .types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .v1415-disc .f{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .v1415-disc .f label{font-size:var(--fs-xs,11px);color:var(--muted);font-weight:var(--fw-semibold,650)}
  .v1415-disc input{border:1px solid var(--brd,var(--line));background:var(--surface-2);color:var(--txt,var(--ink));border-radius:8px;padding:9px 11px;min-height:42px;width:100%}
  .v1415-disc .calc{margin-top:10px;border-top:1px solid var(--brd,var(--line));padding-top:10px;display:grid;gap:4px}
  .v1415-disc .calc .l{display:flex;justify-content:space-between;font-size:var(--fs-sm,12px);color:var(--muted)}
  .v1415-disc .calc .l.pay{color:var(--txt,var(--ink));font-weight:var(--fw-bold,760);font-size:var(--fs-lg,17px)}
  .v1415-disc .calc .l.cut{color:var(--green)}
  .v1415-vis{margin-top:18px}
  .v1415-vis .cat{margin-top:12px;border:1px solid var(--brd,var(--line));border-radius:var(--r10,10px);background:var(--surface)}
  .v1415-vis .cat-h{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:11px 13px;min-height:var(--tap,46px);background:transparent;border:none;color:var(--txt,var(--ink));font-weight:var(--fw-bold,760);cursor:pointer;text-align:left}
  .v1415-vis .cat-h .chev{color:var(--muted);transition:transform .14s ease}
  .v1415-vis .cat.open .cat-h .chev{transform:rotate(90deg)}
  .v1415-vis .cat-b{display:none;padding:0 13px 13px}
  .v1415-vis .cat.open .cat-b{display:block}
  .v1415-vis .vit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--brd,var(--line))}
  .v1415-vis .vit .nm{min-width:0}
  .v1415-vis .vit .nm b{display:block;font-size:var(--fs-sm,12px);color:var(--txt,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v1415-vis .vit .nm small{color:var(--muted)}
  .v1415-tgl{flex:0 0 auto;border:1px solid var(--brd,var(--line));background:var(--surface-2);color:var(--muted);border-radius:999px;min-height:34px;padding:0 14px;font-weight:var(--fw-semibold,650);cursor:pointer}
  .v1415-tgl.on{background:var(--ok-bg);color:var(--green);border-color:var(--green)}
  .v1415-kp-disc td{padding:4px 6px}
  .v1415-kp-disc .cut{color:#b42318}
  `;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  /* ---------- owner catalog (Block C) ---------- */
  function readOwnerCatalog(){try{const el=document.getElementById('ownerCatalogV1415');return el?JSON.parse(el.textContent):[];}catch(err){return [];}}
  const DEST={facade:'materials',countertop:'topMaterials',edge:'edgeCatalog',hardware:'hardwareCatalog',led:'ledCatalog',extra:'extraWorksCatalog',service:'servicesCatalog',corpus:'extraWorksCatalog'};
  function isBase1415(row){
    const s=String(row.name||'').toLowerCase();
    switch(row.cat){
      case 'facade': case 'countertop': case 'edge': case 'service': case 'extra': return true;
      case 'corpus': return false;
      case 'led': return /лент|профил|драйвер|блок пит|power|strip/.test(s);
      case 'hardware': return /петл|доводчик|газлифт|aventos|ручк|hinge/.test(s);
      default: return true;
    }
  }
  function importOwnerCatalog(){
    if(state.__catImportV1415)return;
    const cat=readOwnerCatalog();if(!cat.length)return;
    state.materials=state.materials||[];
    state.topMaterials=state.topMaterials||{};
    state.edgeCatalog=state.edgeCatalog||{};
    cat.forEach((row,idx)=>{
      const name=row.name,base=isBase1415(row),price=n(row.price),cost=n(row.cost);
      const dest=DEST[row.cat]||'extraWorksCatalog';
      if(dest==='materials'){
        if(!state.materials.some(x=>x.client===name||x.tech===name))
          state.materials.push({id:'imp_fac_'+idx,client:name,tech:name,desc:'',price:price,cost:cost,show:base,active:base,badge:'',supplier:row.supplier||'',art:row.art||''});
      }else if(dest==='topMaterials'){
        if(!Object.values(state.topMaterials).some(x=>(x.name||x.client)===name))
          state.topMaterials['imp_top_'+idx]={name:name,price:price,cost:cost,show:base,active:base,supplier:row.supplier||'',art:row.art||''};
      }else{
        const obj=state[dest]=state[dest]||{};
        if(!Object.values(obj).some(x=>(x.client||x.tech)===name))
          obj['imp_'+row.cat+'_'+idx]={client:name,tech:name,price:price,cost:cost,unit:row.unit||'шт',active:base,show:base,supplier:row.supplier||'',art:row.art||'',isCustom:false};
      }
    });
    state.__catImportV1415=true;
  }

  /* ---------- discount (Block A) ---------- */
  function discountInfo(total){
    const d=(state.quote&&state.quote.discount)||{type:'none',value:0};
    let amount=0;
    if(d.type==='percent')amount=n(total)*(n(d.value)/100);
    else if(d.type==='amount')amount=Math.min(n(total),n(d.value));
    amount=Math.max(0,amount);
    return {type:d.type||'none',value:n(d.value),reason:d.reason||'',amount,final:Math.max(0,n(total)-amount)};
  }
  window.applyDiscount=function(total){return discountInfo(total).final};
  window.discountInfoV1415=discountInfo;

  function ensureV1415(){
    if(typeof state!=='object')return state;
    state.version=VERSION_V1415;
    state.quote=state.quote||{};
    state.quote.discount=state.quote.discount||{type:'none',value:0,reason:''};
    state.edgeCatalog=state.edgeCatalog||{};
    state.ui=state.ui||{};
    state.ui.v1415=Object.assign({visOpen:{}},state.ui.v1415||{});
    importOwnerCatalog();
    return state;
  }
  window.ensureV1415=ensureV1415;

  function discountPanelHtml(base,ctx){
    const d=state.quote.discount,info=discountInfo(base);
    const chip=(t,l)=>`<button class="chip ${d.type===t?'active':''}" data-v1415-act="discType" data-type="${t}">${l}</button>`;
    const valLabel=d.type==='percent'?'Скидка, %':'Скидка, €';
    return `<div class="v1415-disc" data-v1415-disc="${ctx}"><h3>Скидка клиенту</h3><div class="types">${chip('none','Нет')}${chip('percent','Процент %')}${chip('amount','Сумма €')}</div>${d.type!=='none'?`<div class="f"><label>${valLabel}</label><input inputmode="decimal" data-v1415-disc-field="value" value="${e(d.value||'')}"></div><div class="f"><label>Причина скидки (необязательно)</label><input data-v1415-disc-field="reason" value="${e(d.reason||'')}" placeholder="постоянный клиент, сезонная акция"></div>`:''}<div class="calc"><div class="l"><span>Цена до скидки</span><span>${m(base)}</span></div>${info.amount>0?`<div class="l cut"><span>Скидка${info.reason?' ('+e(info.reason)+')':''}</span><span>− ${m(info.amount)}</span></div>`:''}<div class="l pay"><span>К оплате</span><span>${m(info.final)}</span></div></div></div>`;
  }

  /* ---------- Block B: visibility screen ---------- */
  const VIS_CATS=[
    {key:'materials',label:'Фасады',type:'arr'},
    {key:'topMaterials',label:'Столешницы',type:'obj'},
    {key:'edgeCatalog',label:'Кромка',type:'obj'},
    {key:'hardwareCatalog',label:'Фурнитура',type:'obj'},
    {key:'ledCatalog',label:'LED',type:'obj'},
    {key:'extraWorksCatalog',label:'Доп.работы',type:'obj'},
    {key:'servicesCatalog',label:'Услуги',type:'obj'}
  ];
  function itName(cat,it){return cat.type==='arr'?(it.client||it.tech||it.id):(it.name||it.client||it.tech)}
  function visEntries(cat){
    const src=state[cat.key];if(!src)return [];
    if(cat.type==='arr')return src.map(x=>({id:x.id,it:x}));
    return Object.entries(src).map(([id,it])=>({id,it}));
  }
  function visItemHtml(cat,id,it){
    const on=it.active!==false;
    return `<div class="vit"><div class="nm"><b>${e(itName(cat,it))}</b><small>${m(it.price)}${it.unit?' / '+e(it.unit):''}${it.supplier?' · '+e(it.supplier):''}</small></div><button class="v1415-tgl ${on?'on':''}" data-v1415-act="visToggle" data-cat="${cat.key}" data-type="${cat.type}" data-id="${e(id)}">${on?'ON':'OFF'}</button></div>`;
  }
  function visCatHtml(cat){
    const entries=visEntries(cat);const open=!!state.ui.v1415.visOpen[cat.key];
    const onCount=entries.filter(x=>x.it.active!==false).length;
    return `<div class="cat ${open?'open':''}" data-v1415-vis-cat="${cat.key}"><button class="cat-h" data-v1415-act="visCat" data-cat="${cat.key}"><span>${e(cat.label)} · ${onCount}/${entries.length} вкл.</span><span class="chev">▸</span></button><div class="cat-b">${entries.map(x=>visItemHtml(cat,x.id,x.it)).join('')||'<div class="empty">Позиций нет.</div>'}<button class="btn soft" style="margin-top:10px" data-v1415-act="visAdd" data-cat="${cat.key}" data-type="${cat.type}">＋ Своя позиция</button></div></div>`;
  }
  function injectVisibilityV1415(){
    const pane=document.getElementById('pane-settings');if(!pane)return;
    if(pane.querySelector('[data-v1415-vis]'))return;
    const wrap=document.createElement('div');wrap.className='v1415-vis';wrap.setAttribute('data-v1415-vis','1');
    wrap.innerHTML=`<div class="section-title" style="margin-top:18px">Видимость позиций — что показывать клиенту</div><div class="subtitle">ON = доступна в Смете/заказе. OFF = скрыта, но данные целы.</div>${VIS_CATS.map(visCatHtml).join('')}`;
    pane.appendChild(wrap);
  }

  /* ---------- injection into Money + Смета ---------- */
  function injectDiscountMoney(){
    const pane=document.getElementById('pane-money');if(!pane)return;
    if(pane.querySelector('[data-v1415-disc="money"]'))return;
    const t=(typeof totals==='function')?totals():{totalClient:0};
    const card=pane.querySelector('.card.money-safe')||pane.firstElementChild;
    if(card)card.insertAdjacentHTML('afterend',discountPanelHtml(n(t.totalClient),'money'));
    else pane.insertAdjacentHTML('beforeend',discountPanelHtml(n(t.totalClient),'money'));
  }
  function injectDiscountSmeta(){
    const pane=document.getElementById('pane-measure');if(!pane)return;
    const smeta=pane.querySelector('[data-v1414-smeta]');if(!smeta)return;
    if(smeta.querySelector('[data-v1415-disc="smeta"]'))return;
    const tot=(window.__v1414&&window.__v1414.smetaTotals)?window.__v1414.smetaTotals().client:0;
    smeta.insertAdjacentHTML('beforeend',discountPanelHtml(n(tot),'smeta'));
  }

          'Бэкап от '+expAt+'\n'+n+' проектов.\n\n'+
