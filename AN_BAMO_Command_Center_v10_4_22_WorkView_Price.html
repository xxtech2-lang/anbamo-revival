/* v10.4.2.1: semantic text tokens for readable dark cards and controls */
:root{
  --text-primary:var(--ink);
  --text-secondary:var(--muted);
  --text-tertiary:var(--soft);
  --control-bg:var(--surface);
  --control-bg-soft:var(--surface-2);
  --control-active:var(--info-bg);
  --control-text:var(--ink);
  --placeholder-text:var(--soft);
}
body[data-theme="dark"]{
  --text-primary:#f8fafc;
  --text-secondary:#cbd5e1;
  --text-tertiary:#94a3b8;
  --control-bg:#111827;
  --control-bg-soft:#172033;
  --control-active:rgba(10,132,255,.22);
  --control-text:#f8fafc;
  --placeholder-text:#94a3b8;
}
body{color:var(--text-primary)}
button{color:inherit}
input,select,textarea{background:var(--control-bg);color:var(--control-text)}
input::placeholder,textarea::placeholder{color:var(--placeholder-text)}
.card,.zone,.variant,.improve,.kpi,.row-item,.traffic,.summary-card,.modal-card,.bottom-total,.measure-group,.stepper,.more-sheet .btn,.capture-actions .btn{color:var(--text-primary)}
.btn,.chip,.pill,.tab.active,.mobile-tab.active,.measure-group{color:var(--control-text)}
.subtitle,.section-title,.field label,.label,.variant .desc,.improve small,.kpi .k,.row-item .meta,.traffic-row,.empty,.brand-sub,.bottom-total span,.techline,.measure-group small,.muted{color:var(--text-secondary)}
.title,.zone-title,.variant .name,.summary-card strong,.bottom-total strong,.capture-type,.measure-group b,.stepper .value{color:var(--text-primary)}
.measure-group,.quick-improve,.stepper,.stepper button{background:var(--control-bg)}
.measure-group.active,.quick-improve.on{background:var(--control-active);border-color:color-mix(in srgb,var(--blue) 46%,var(--line))}
.quick-improve-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 12px}
.quick-improve{border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;min-height:74px;cursor:pointer}
.quick-improve b{display:block;font-size:13px;line-height:1.2;color:var(--text-primary)}
.quick-improve small{display:block;margin-top:5px;color:var(--text-secondary);line-height:1.25}
.quick-improve .price{margin-top:8px;font-weight:950;color:var(--blue)}
.quick-improve.on .price{color:var(--green)}
.hardware-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hardware-mini .mini-card{border:1px solid var(--line);border-radius:16px;background:var(--control-bg-soft);padding:10px;color:var(--text-primary)}
.hardware-mini .mini-card span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:950;color:var(--text-secondary)}
.hardware-mini .mini-card b{display:block;margin-top:4px;font-size:18px;color:var(--text-primary)}
.doc .muted{color:#667085}
@media (max-width:540px){.quick-improve-grid{grid-template-columns:1fr}.hardware-mini{grid-template-columns:1fr 1fr}}

.fast-flow{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.flow-card{position:relative}
.flow-index{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:var(--control-active);color:var(--blue);font-weight:950;margin-right:8px}
.request-brief{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.request-brief .summary-card span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:950;color:var(--text-secondary)}
.quote-zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quote-zones .zone{margin:0}
.quote-zones .zone-head{align-items:flex-start}
.hardware-mode{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.hardware-mode .chip{justify-content:center;text-align:center}
.price-split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.price-split .summary-card{border-left:5px solid var(--line-strong)}
.price-split .base{border-left-color:var(--green)}
.price-split .extras{border-left-color:var(--amber)}
.price-split .total{border-left-color:var(--blue)}
.improve-status{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:18px;background:var(--control-bg);padding:11px;margin:8px 0;color:var(--text-primary)}
.improve-status b{display:block;color:var(--text-primary)}
.improve-status small{display:block;color:var(--text-secondary);margin-top:4px;line-height:1.25}
.status-pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950;color:var(--text-primary);background:var(--control-bg-soft);white-space:nowrap}
.improve-status.hidden{opacity:.72}
.improve-status.recommend{border-color:color-mix(in srgb,var(--amber) 46%,var(--line));background:var(--warn-bg)}
.improve-status.included{border-color:color-mix(in srgb,var(--green) 46%,var(--line));background:var(--ok-bg)}
.settings-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.settings-block{scroll-margin-top:82px}
.catalog-row{border:1px solid var(--line);border-radius:18px;background:var(--control-bg);padding:12px;margin:10px 0;color:var(--text-primary)}
.catalog-row .toolbar{margin-top:10px}
.catalog-row .chip{min-height:34px}
.catalog-row.disabled{opacity:.72}
.catalog-row.hidden-in-quote{border-style:dashed}
.price-foundation-note{border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));background:var(--info-bg);border-radius:18px;padding:12px;margin:10px 0;color:var(--text-primary)}
.price-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding:4px 0 8px;margin:8px 0 12px}
.price-tabs .chip{flex:0 0 auto;min-height:44px}
.price-card{border:1px solid var(--line);background:var(--control-bg);border-radius:18px;padding:12px;margin:10px 0;color:var(--text-primary);box-shadow:var(--shadow-sm)}
.price-card.inactive{opacity:.74}
.price-card.hidden-quote{border-style:dashed}
.price-card-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;margin-bottom:10px}
.price-card-title{font-size:17px;font-weight:950;line-height:1.22;color:var(--text-primary)}
.price-card-tech{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.3}
.price-card-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.price-badge{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:950;white-space:nowrap;color:var(--text-primary)}
.price-badge.warn{background:var(--warn-bg);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 38%,var(--line))}
.price-badge.bad{background:var(--bad-bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 38%,var(--line))}
.price-form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.price-form-grid .span-2{grid-column:span 2}
.price-form-grid .span-4{grid-column:1 / -1}
.price-field{position:relative}
.price-field label{display:block;font-size:11px;line-height:1.2;color:var(--text-secondary);font-weight:900;text-transform:uppercase;letter-spacing:.035em;margin-bottom:5px}
.price-field input,.price-field select{min-height:44px;border-radius:13px;padding-right:48px}
.price-field textarea{min-height:74px;border-radius:13px}
.price-suffix{position:absolute;right:10px;bottom:12px;font-size:12px;font-weight:950;color:var(--text-secondary);pointer-events:none}
.price-mini-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
.price-toggle{min-height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:950;color:var(--text-primary);cursor:pointer}
.price-toggle.active{background:var(--control-active);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 36%,var(--line))}
.price-where{font-size:12px;color:var(--text-secondary);font-weight:850;line-height:1.35;margin-top:8px}
.price-impact{border:1px dashed var(--line-strong);background:var(--surface-2);border-radius:14px;padding:9px;margin-top:9px;font-size:12px;line-height:1.35;color:var(--text-primary)}
.price-advanced{margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.price-advanced summary{cursor:pointer;font-weight:950;color:var(--text-primary);min-height:44px;display:flex;align-items:center}
.price-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.price-actions .btn.sm{min-height:44px}
.settings-save-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.settings-save-strip .pill{min-height:34px}
.settings-internal-label{border:1px solid color-mix(in srgb,var(--amber) 34%,var(--line));background:var(--warn-bg);color:var(--amber);border-radius:16px;padding:10px 12px;font-weight:850;line-height:1.35;margin-top:10px}
@media (max-width:680px){
  .price-form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .price-form-grid .span-2,.price-form-grid .span-4{grid-column:1 / -1}
  .price-card{padding:11px;border-radius:16px}
  .price-card-head{grid-template-columns:1fr}
  .price-card-badges{justify-content:flex-start}
}
@media (min-width:1024px){
  .fast-flow{grid-template-columns:1fr 1fr;gap:var(--gap)}
  .fast-flow .wide{grid-column:1 / -1}
  .fast-flow .flow-card{margin-top:0}
}
@media (max-width:680px){
  .request-brief,.quote-zones,.price-split{grid-template-columns:1fr}
  .hardware-mode{grid-template-columns:1fr}
}

.measure-notebook{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr);gap:var(--gap);align-items:start}
.measure-panel{position:sticky;top:92px}
.measure-head-card{margin-top:0}
.measure-head-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.measure-group-switcher{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin}
.measure-group-switcher .chip{flex:0 0 auto;min-height:34px;padding:6px 10px}
.measure-active-card{border:1px solid var(--line);border-left:5px solid var(--blue);background:var(--surface);border-radius:14px;padding:10px 11px;margin:8px 0;box-shadow:var(--shadow-sm)}
.measure-active-card.green{border-left-color:var(--green)}
.measure-active-card.purple{border-left-color:var(--purple)}

.measure-active-card.teal{border-left-color:var(--teal)}
.measure-positions-card{margin:8px 0}
.measure-other-title{font-size:12px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 7px}
.measure-group-card{border:1px solid var(--line);border-left:5px solid var(--blue);background:var(--surface);border-radius:14px;padding:10px 11px;margin:7px 0;box-shadow:var(--shadow-sm)}
.measure-group-card.green{border-left-color:var(--green)}
.measure-group-card.purple{border-left-color:var(--purple)}
.measure-group-card.amber{border-left-color:var(--amber)}
.measure-group-card.teal{border-left-color:var(--teal)}
.measure-group-card.active{box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 18%,transparent),var(--shadow-sm)}
.measure-group-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.measure-group-name{font-size:16px;font-weight:950;color:var(--ink);line-height:1.15}
.measure-group-hint{font-size:12px;color:var(--muted);line-height:1.28;margin-top:2px}
.measure-compact-line{font-size:12px;color:var(--muted);font-weight:900;margin-top:5px}
.measure-active-badge{display:inline-flex;align-items:center;min-height:26px;border:1px solid color-mix(in srgb,var(--blue) 38%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue);font-size:11px;font-weight:950;padding:4px 8px}
.measure-mini-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.measure-mini-chips span{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:5px 8px;font-size:12px;font-weight:950}
.measure-group-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}
.measure-stat{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:7px 8px;min-width:0}
.measure-stat span{display:block;font-size:10px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.04em}
.measure-stat b{display:block;color:var(--ink);font-size:15px;margin-top:2px}
.measure-group-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.measure-group-list{display:grid;gap:8px;margin-top:9px}
.measure-empty-inline{color:var(--muted);font-size:12px;font-weight:850;margin-top:8px}
.measure-item-card{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:9px}
.measure-item-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.measure-item-title{font-weight:950;color:var(--ink)}
.measure-item-meta{font-size:12px;color:var(--muted);line-height:1.35;margin-top:3px}
.measure-item-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.measure-work{min-width:0}
.measure-work.collapsed{display:grid;gap:8px}
.measure-entry-shell{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;margin:var(--gap) 0;box-shadow:var(--shadow-md)}
.measure-entry-shell .card-head{margin-bottom:10px}
.measure-entry-group{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:950;margin-bottom:8px}
.measure-type-tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:8px 0 10px}
.measure-type-tabs .chip{min-height:34px;padding:6px 8px;text-align:center;font-size:12px}
.measure-draft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.measure-draft-grid .span-2{grid-column:span 2}
.measure-draft-grid .span-4{grid-column:1 / -1}
.measure-draft-grid.basics{grid-template-columns:repeat(4,minmax(0,1fr))}
.measure-draft-grid.basics .wide{grid-column:span 2}
.measure-type-block{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px;margin-top:10px}
.measure-presets{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.measure-presets .chip{min-height:31px;padding:6px 9px;font-size:12px}
.measure-number{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:5px;align-items:end}
.measure-number .btn{min-height:42px;padding:0;font-size:18px}
.measure-entry-preview{border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));background:var(--info-bg);color:var(--ink);border-radius:14px;padding:9px 10px;margin:10px 0 8px;font-weight:950;line-height:1.35}
.measure-entry-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start;margin:8px 0 10px}
.measure-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.measure-summary-card{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px}
.measure-summary-card span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:950}
.measure-summary-card b{font-size:18px;color:var(--ink)}
.measure-validation{border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-top:8px;font-weight:850;line-height:1.35}
.measure-validation.ok{background:var(--ok-bg);color:var(--green);border-color:color-mix(in srgb,var(--green) 32%,var(--line))}
.measure-validation.warn{background:var(--warn-bg);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 32%,var(--line))}
.measure-validation.bad{background:var(--bad-bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 32%,var(--line))}
.measure-capture-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.measure-capture-grid .btn{justify-content:flex-start;text-align:left;min-height:58px}
.measure-capture-grid .disabled{opacity:.55;cursor:not-allowed}
.quick-chip-grid{display:flex;gap:7px;flex-wrap:wrap}
.measure-compare{border:1px dashed var(--line-strong);border-radius:16px;padding:11px;margin-top:12px;background:var(--surface-2)}
@media (max-width:1180px){.measure-notebook{grid-template-columns:1fr}.measure-panel{position:static}.measure-summary-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:820px){.measure-notebook{grid-template-columns:1fr}.measure-draft-grid,.measure-draft-grid.basics{grid-template-columns:repeat(2,minmax(0,1fr))}.measure-draft-grid .span-2,.measure-draft-grid .span-4,.measure-draft-grid.basics .wide{grid-column:1 / -1}.measure-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.measure-capture-grid{grid-template-columns:1fr}.measure-group-card{padding:9px 10px}.measure-group-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.measure-stat{padding:6px}.measure-stat b{font-size:14px}.measure-group-actions .btn{flex:1 1 130px}.measure-type-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}.measure-entry-toolbar .btn{flex:1 1 145px}}
@media (max-width:460px){.measure-notebook,.measure-notebook>div{max-width:calc(100vw - 24px);overflow-x:hidden}.measure-head-card,.measure-active-card,.measure-entry-shell,.measure-positions-card,.measure-panel.summary,.measure-panel.summary+.card{max-width:calc(100vw - 24px)}.measure-entry-preview{max-width:100%;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 8px}.measure-head-card{padding:10px 12px;margin:8px 0}.measure-head-card .title{font-size:20px}.measure-head-card .subtitle{display:none}.measure-entry-shell .subtitle{font-size:12px;line-height:1.3}.measure-head-actions{margin-top:6px}.measure-head-actions .btn{flex:1 1 130px}.measure-active-card{padding:9px 10px}.measure-active-card .measure-group-hint{display:none}.measure-group-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.measure-number{grid-template-columns:38px minmax(0,1fr) 38px}.measure-draft-grid{gap:7px}.measure-item-head{grid-template-columns:1fr}.measure-item-actions{justify-content:flex-start}.measure-type-tabs{display:flex;overflow-x:auto;scrollbar-width:thin}.measure-type-tabs .chip{font-size:11px;padding:5px 9px;min-height:32px;flex:0 0 auto}.measure-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.measure-entry-toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;width:calc(100vw - 50px);max-width:100%}.measure-entry-toolbar .btn{width:100%;min-width:0;font-size:11px;padding-left:6px;padding-right:6px;white-space:nowrap}}

.measure-passport{border-left:5px solid var(--purple);margin:8px 0 10px}
.measure-passport-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.measure-passport-line{margin-top:5px;color:var(--muted);font-size:12px;font-weight:900;line-height:1.35}
.measure-passport-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.measure-passport-section{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px}
.measure-passport-section.full{grid-column:1 / -1}
.measure-passport-section .section-title{margin-top:0}
.measure-passport-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.passport-mini{display:block;font-size:11px;color:var(--muted);font-weight:950;margin:4px 0}
.measure-entry-shell.passport-entry{border-left:6px solid var(--blue);padding:11px}
.measure-entry-shell.passport-entry.green{border-left-color:var(--green)}
.measure-entry-shell.passport-entry.purple{border-left-color:var(--purple)}
.measure-entry-shell.passport-entry.amber{border-left-color:var(--amber)}
.measure-entry-shell.passport-entry.teal{border-left-color:var(--teal)}
.measure-now{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}

.measure-compact-grid.meta{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:8px}
.measure-type-tabs.compact{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}

.measure-fast-flags .chip{min-height:36px;padding:6px 10px}

.measure-entry-preview.notebook{font-size:13px;white-space:normal}
.measure-item-card.excluded{opacity:.72;border-style:dashed}
.measure-button-block{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:8px;margin:8px 0}

.measure-button-row{display:flex;gap:6px;flex-wrap:wrap}
.measure-button-row .chip{min-height:36px;padding:6px 10px;font-weight:900}

.measure-mechanics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

  payments:[], expenses:[], versions:[], tasks:[], risks:['Старые корпуса могут ограничить идеальную регулировку зазоров.'], audit:{swollen:false, crooked:false, handlesClient:false, legsCheck:false, hoodCheck:false}
};
let state=loadState();
let saveTimer=null;
function loadState(){const keys=[KEY,...LEGACY_KEYS];for(const key of keys){try{const raw=localStorage.getItem(key);if(raw){const loaded=merge(DEFAULT,JSON.parse(raw));loaded.version='v10.4.6.1 Touch Target QA Fix';return loaded}}catch(e){}}return clone(DEFAULT)}
function merge(base,over){const out=clone(base);Object.keys(over||{}).forEach(k=>{if(Array.isArray(over[k]))out[k]=over[k];else if(over[k]&&typeof over[k]==='object'&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))out[k]=merge(base[k],over[k]);else out[k]=over[k]});return out}
function saveNow(){localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveState').textContent='сохранено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function markDirty(){document.getElementById('saveState').textContent='сохраняю...';clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,180)}
function activeMaterial(){return state.materials.find(m=>m.id===state.selectedMaterial)||state.materials.find(m=>m.show&&m.active)||state.materials[0]}
state.selectedMaterial=state.selectedMaterial||'mdf';
function faceArea(){return state.zones.reduce((a,z)=>a+Math.max(0,num(z.len)*num(z.height)/1000-num(z.deduct)),0)}
function doorsCount(){return state.zones.reduce((a,z)=>a+num(z.doors),0)}
function drawersCount(){return state.zones.reduce((a,z)=>a+num(z.drawers),0)}
function hingesCount(){return state.zones.reduce((a,z)=>a+num(z.doors)*(num(z.height)>1600?4:num(z.height)>900?3:2),0)}
function topCalc(){if(!state.top.enabled)return {sell:0,cost:0,warnings:[]};const m=state.topMaterials[state.top.material];let sell=num(state.top.len)*m.price,cost=num(state.top.len)*m.cost,warnings=[];sell+=(num(state.top.sinkCuts)*35)+(num(state.top.hobCuts)*25);cost+=(num(state.top.sinkCuts)*12)+(num(state.top.hobCuts)*8);if(num(state.top.len)>m.blank){sell+=60;cost+=25;warnings.push(`Длина столешницы больше заготовки ${m.blank} м: нужен стык / еврозапил.`)}if(state.top.sinkType==='under'&&!m.under){warnings.push('Подстольная мойка выбрана для материала, который этого не поддерживает.');}if(state.top.sinkType==='under'&&m.under){sell+=45;cost+=18;}return {sell,cost,warnings}}
function materialQuote(mat){const area=faceArea();const work=area*42 + doorsCount()*4;const hardwareBase=0;const top=topCalc();const sell=area*mat.price + work + hardwareBase + top.sell;const cost=area*mat.cost + area*18 + top.cost;return {area,work,top,sell,cost,profit:sell-cost}}
function improvementValue(i){if(i.id==='mdfLacquer' && activeMaterial().id!=='mdf')return {sell:0,cost:0,visible:false};let q=1;if(i.unit==='hinge')q=hingesCount();if(i.unit==='drawer')q=drawersCount();if(i.unit==='led')q=num(i.meters)||0;if(i.unit==='mdfArea')q=faceArea();return {sell:q*num(i.price),cost:q*num(i.cost),qty:q,visible:true}}
function totals(){const base=materialQuote(activeMaterial());const improvements=state.improvements.filter(i=>i.selected).reduce((a,i)=>{const v=improvementValue(i);return {sell:a.sell+v.sell,cost:a.cost+v.cost}},{sell:0,cost:0});const expenses=state.expenses.reduce((a,x)=>a+num(x.amount),0);const paid=state.payments.reduce((a,x)=>a+num(x.amount),0);const totalClient=base.sell+improvements.sell;const totalCost=base.cost+improvements.cost+expenses;const profit=totalClient-totalCost;const margin=totalClient?profit/totalClient*100:0;return {base,improvements,totalClient,totalCost,profit,margin,paid,remaining:Math.max(0,totalClient-paid)}}
function validations(){const list=[];if(!state.project.client)list.push({level:'warn',text:'Не указан клиент.'});if(!state.project.phone)list.push({level:'warn',text:'Не указан телефон.'});if(faceArea()<=0)list.push({level:'bad',text:'Нет площади фасадов.'});if(state.top.enabled&&state.top.sinkType==='under'&&!state.topMaterials[state.top.material].under)list.push({level:'bad',text:'Подстольная мойка несовместима с выбранной столешницей.'});if(state.improvements.find(i=>i.id==='led')?.selected && improvementValue(state.improvements.find(i=>i.id==='led')).qty<=0)list.push({level:'bad',text:'LED включён, но длина подсветки не указана.'});if(state.audit.handlesClient && !state.tasks.some(t=>/руч/i.test(t.text)))list.push({level:'warn',text:'Клиент покупает ручки сам — добавь количество ручек в задачи.'});if(totals().margin < state.settings.marginWarn)list.push({level:'warn',text:'Маржа ниже заданного порога.'});topCalc().warnings.forEach(w=>list.push({level:w.includes('не поддерживает')?'bad':'warn',text:w}));return list}
function traffic(){const v=validations();if(v.some(x=>x.level==='bad'))return {level:'bad',text:'есть блокер'};if(v.some(x=>x.level==='warn'))return {level:'warn',text:'проверить'};return {level:'ok',text:'можно показывать'}}

function renderRequest(){document.getElementById('pane-request').innerHTML=`<div class="layout-3"><div class="card"><div class="title">Заявка</div><div class="subtitle">Быстро фиксируем клиента, объект и стартовые условия.</div><div class="section-title">Клиент / проект</div>${input('Клиент','project.client',state.project.client,'Иванов / кухня')}${input('Телефон','project.phone',state.project.phone,'+372...')}${input('Адрес','project.address',state.project.address,'Tallinn, ...')}<div class="grid g2"><div>${select('Статус проекта','project.status',state.project.status,['Новая заявка','ПредКП подготовлено','ПредКП отправлено','Замер назначен','Замер сделан','Ожидаем аванс','Аванс получен','В производстве','Монтаж назначен','Установлено','Закрыт','Отказ'])}</div><div>${select('Что хочет клиент','project.want',state.project.want,['Только фасады','Фасады + столешница','Фасады + фурнитура','Полное обновление кухни'])}</div></div>${textarea('Комментарий к заявке','project.comment',state.project.comment)}</div><div class="card"><div class="title">Проверка проекта</div>${renderTrafficBox()}</div><div class="card"><div class="title">Версии / слепки</div><div class="subtitle">Клиент может вернуться к старому варианту. Слепок хранит состав и суммы.</div><button class="btn primary" data-action="snapshot">Сделать слепок версии</button><div class="row-list" style="margin-top:12px">${state.versions.map(v=>`<div class="row-item"><div><b>${v.name}</b><div class="meta">${new Date(v.date).toLocaleString('ru-RU')} · ${money(v.total)}</div></div><div class="toolbar"><button class="btn sm" data-action="restoreVersion" data-id="${v.id}">Открыть</button><button class="btn sm red" data-action="deleteVersion" data-id="${v.id}">✕</button></div></div>`).join('')||'<div class="empty">Слепков пока нет.</div>'}</div></div></div>`}
function renderTrafficBox(){const v=validations();const tr=traffic();return `<div class="traffic"><div class="traffic-row"><span class="dot ${tr.level==='ok'?'green':tr.level==='bad'?'red':'amber'}"></span><div><b>${tr.level==='ok'?'Зелёный':tr.level==='bad'?'Красный':'Жёлтый'}</b><div class="subtitle">${tr.level==='ok'?'Можно показывать клиенту.':tr.level==='bad'?'Есть блокер, сначала исправить.':'Можно работать, но есть мягкие проверки.'}</div></div></div></div>${v.map(x=>`<div class="notice ${x.level}">${x.level==='bad'?'⛔':x.level==='warn'?'⚠️':'✅'} ${x.text}</div>`).join('')||'<div class="notice ok">✅ Критичных замечаний нет.</div>'}`}
function renderFast(){const t=totals();document.getElementById('pane-fast').innerHTML=`<div class="layout"><div><div class="card"><div class="title">Быстрый расчёт по зонам</div><div class="subtitle">Для предКП по фото/звонку: длина × высота, двери, ящики, столешница.</div>${state.zones.map(z=>renderZone(z)).join('')}<button class="btn" data-action="addZone">+ Добавить зону</button></div><div class="card"><div class="title">Столешница</div><div class="subtitle">Материал, длина, вырезы и базовые проверки.</div><div class="chip-row"><button class="chip ${state.top.enabled?'active':''}" data-action="toggleTop">${state.top.enabled?'✓ ':''}Столешница нужна</button></div>${state.top.enabled?renderTop():''}</div></div><div><div class="card client-safe"><div class="title">Варианты фасадов для клиента</div><div class="subtitle">Не продаём “€/м²”. Показываем понятные варианты и итог за кухню.</div>${state.materials.filter(m=>m.active&&m.show).map(renderMaterialVariant).join('')}</div><div class="card"><div class="title">Сводка расчёта</div><div class="calc-split"><div class="summary-card"><span class="muted">Основное предложение</span><br><strong>${money(t.base.sell)}</strong></div><div class="summary-card"><span class="muted">Выбранные улучшения</span><br><strong>${money(t.improvements.sell)}</strong></div><div class="summary-card"><span class="muted">Итого клиенту</span><br><strong>${money(t.totalClient)}</strong></div><div class="summary-card"><span class="muted">Маржа</span><br><strong>${Math.round(t.margin)}%</strong></div></div></div></div></div>`}

function renderImprovements(){document.getElementById('pane-improvements').innerHTML=`<div class="layout"><div class="card optional-safe"><div class="title">Дополнительные улучшения</div><div class="subtitle">Не включаются в основную цену, пока клиент не подтвердил. В КП идут отдельным блоком.</div>${state.improvements.map(i=>{const v=improvementValue(i);if(!v.visible)return '';return `<div class="improve ${i.selected?'on':''}" data-action="toggleImprove" data-id="${i.id}"><div class="ico">${i.icon}</div><div><b>${i.title}</b><small>${i.desc}</small>${i.id==='led'?`<div style="margin-top:8px;max-width:180px">${input('LED, м',`improvement:${i.id}.meters`,i.meters,'3')}</div>`:''}</div><div><div class="price">+${money(v.sell)}</div><div class="toggle"></div></div></div>`}).join('')}</div><div class="card"><div class="title">Как это попадёт в КП</div><div class="notice warn">Основное предложение показывается отдельно. Улучшения подписаны как “по желанию, добавляются только по подтверждению”.</div>${renderTrafficBox()}</div></div>`}

div>`).join('')}</div>`}
function input(label,binding,value,placeholder=''){return `<div class="field"><label>${label}</label><input value="${String(value??'').replaceAll('"','&quot;')}" placeholder="${placeholder}" data-bind="${binding}"></div>`}
function textarea(label,binding,value){return `<div class="field"><label>${label}</label><textarea data-bind="${binding}">${String(value??'').replaceAll('<','&lt;')}</textarea></div>`}
function select(label,binding,value,options){return `<div class="field"><label>${label}</label><select data-bind="${binding}">${options.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select></div>`}
function stepper(label,key,value,id){return `<div><label class="label">${label}</label><div class="stepper"><button data-step="${key}" data-id="${id}" data-delta="-1">−</button><div class="value">${value}</div><button data-step="${key}" data-id="${id}" data-delta="1">+</button></div></div>`}
function docHtml(type){const t=totals(),mat=activeMaterial();if(type==='kp')return `<div class="doc"><h2>Обновление кухни без полной замены мебели</h2><p class="muted">${state.project.client||'Клиент'} · ${state.project.address||''}</p><h3>Ваш запрос</h3><p>${state.project.want}. Корпуса остаются, если они в хорошем состоянии.</p><h3>Основное предложение</h3><table class="doc-table"><tbody><tr><td>Вариант фасадов</td><td>${mat.client}</td><td>${money(t.base.sell)}</td></tr>${state.top.enabled?`<tr><td>Столешница</td><td>${state.topMaterials[state.top.material].name}, ${state.top.len} м</td><td>включено в расчёт</td></tr>`:''}</tbody></table><h3>Дополнительные улучшения по желанию</h3><table class="doc-table"><tbody>${state.improvements.filter(i=>i.selected).map(i=>`<tr><td>${i.title}</td><td>${i.desc}</td><td>${money(improvementValue(i).sell)}</td></tr>`).join('')||'<tr><td colspan="3">Пока не выбраны</td></tr>'}</tbody></table><div class="doc-total"><div><b>Итого с выбранными улучшениями</b><p class="muted">Замер 40 € засчитывается при заказе.</p></div><strong>${money(t.totalClient)}</strong></div><h3>Как проходит заказ</h3><ol><li>Вы выбираете материал и комплектацию.</li><li>Фиксируем размеры и условия.</li><li>Оплачивается аванс.</li><li>Запускаем фасады / столешницу в работу.</li><li>Согласовываем дату монтажа.</li><li>Демонтируем старое и устанавливаем новое.</li><li>Передаём рекомендации по уходу и гарантию.</li></ol><h3>Важно</h3><p>Если корпуса кухни повреждены влагой или стоят с сильным перекосом, идеальный результат без ремонта корпусов может быть невозможен. Об этом предупреждаем до запуска заказа.</p></div>`;if(type==='meeting')return `<div class="doc"><h2>Сводка встречи</h2><h3>Комментарий</h3><p>${state.project.comment||'—'}</p><h3>Задачи клиента</h3><ul>${state.tasks.filter(x=>x.side==='client').map(x=>`<li>${x.text}</li>`).join('')||'<li>Пока не указано</li>'}</ul><h3>Задачи AN BAMO</h3><ul>${state.tasks.filter(x=>x.side!=='client').map(x=>`<li>${x.text}</li>`).join('')||'<li>Подготовить финальное КП / ТЗ</li>'}</ul><h3>Риски</h3><ul>${state.risks.map(r=>`<li>${r}</li>`).join('')}</ul></div>`;if(type==='mount')return `<div class="doc"><h2>Пакет монтажника</h2><p class="muted">Адрес: ${state.project.address||'—'} · контакт: ${state.project.phone||'—'}</p><h3>Зоны</h3><table class="doc-table"><thead><tr><th>Зона</th><th>Размер/площадь</th><th>Двери</th><th>Ящики</th></tr></thead><tbody>${state.zones.map(z=>`<tr><td>${z.name}</td><td>${z.len} м × ${z.height} мм · ${(Math.max(0,z.len*z.height/1000-z.deduct)).toFixed(2)} м²</td><td>${z.doors}</td><td>${z.drawers}</td></tr>`).join('')}</tbody></table><h3>Не включено</h3><p>Себестоимость, маржа и внутренние цены в этот пакет не включаются.</p></div>`;if(type==='money')return `<div class="doc"><h2>Финансовая сводка</h2><table class="doc-table"><tbody><tr><td>Итого клиенту</td><td>${money(t.totalClient)}</td></tr><tr><td>Получено</td><td>${money(t.paid)}</td></tr><tr><td>Остаток</td><td>${money(t.remaining)}</td></tr><tr><td>Себестоимость + расходы</td><td>${money(t.totalCost)}</td></tr><tr><td>Прибыль</td><td>${money(t.profit)}</td></tr><tr><td>Маржа</td><td>${Math.round(t.margin)}%</td></tr></tbody></table></div>`;return `<div class="doc"><h2>Акт приёмки</h2><ul><li>Фасады установлены.</li><li>Зазоры проверены.</li><li>Петли отрегулированы.</li><li>Столешница без видимых повреждений.</li><li>Клиент осмотрел работу.</li><li>Методичка по уходу передана.</li></ul><p style="margin-top:60px">Подпись клиента: <span style="display:inline-block;min-width:220px;height:1.2em;border-bottom:1px solid #0f172a"></span></p></div>`}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function toast(text,type='ok'){const d=document.createElement('div');d.className='toast '+(type==='bad'?'bad':type==='warn'?'warn':'');d.textContent=text;document.getElementById('toastWrap').appendChild(d);setTimeout(()=>d.remove(),2500)}function setTab(tab){state.ui.tab=tab;render();markDirty();window.scrollTo({top:0,behavior:'smooth'}) }function renderCurrent(){render();markDirty()}
document.addEventListener('click',e=>{const b=e.target.closest('button,.tab,.mobile-tab,.variant,.improve,.chip');if(!b)return;const a=b.dataset.action;if(b.dataset.tab)return setTab(b.dataset.tab);if(b.id==='modalClose')return closeModal();if(b.id==='themeBtn'){state.ui.theme=state.ui.theme==='light'?'dark':state.ui.theme==='dark'?'system':'light';return renderCurrent()}if(b.id==='modeBtn'){state.ui.tech=!state.ui.tech;toast(state.ui.tech?'Технический режим включён: себестоимость и маржа видны.':'Основной режим включён.');return renderCurrent()}if(b.id==='kpBtn')return openModal('КП для клиента',docHtml('kp'));if(b.id==='captureBtn'||b.id==='captureBtnBottom')return openModal('Быстрая фиксация',`<div class="grid g2"><button class="btn" data-action="quickTaskClient">Задача клиенту</button><button class="btn" data-action="quickTaskUs">Задача AN BAMO</button><button class="btn" data-action="quickRisk">Риск</button><button class="btn" data-action="addZone">Зона фасадов</button></div>`);if(a==='theme'){state.ui.theme=b.dataset.value;return renderCurrent()}if(a==='contrast'){state.ui.contrast=state.ui.contrast==='high'?'normal':'high';return renderCurrent()}if(a==='density'){state.ui.density=state.ui.density==='compact'?'comfort':'compact';return renderCurrent()}if(a==='addZone'){state.zones.push({id:uid('zone'),name:'Новая зона',color:'purple',len:1,height:720,deduct:0,doors:1,drawers:0});toast('Зона добавлена');closeModal();return renderCurrent()}if(a==='removeZone'){state.zones=state.zones.filter(z=>z.id!==b.dataset.id);toast('Зона удалена','warn');return renderCurrent()}if(b.dataset.step){if(b.dataset.id==='top'){state.top[b.dataset.step]=Math.max(0,num(state.top[b.dataset.step])+num(b.dataset.delta));}else{const z=state.zones.find(x=>x.id===b.dataset.id);z[b.dataset.step]=Math.max(0,num(z[b.dataset.step])+num(b.dataset.delta));}return renderCurrent()}if(a==='toggleTop'){state.top.enabled=!state.top.enabled;return renderCurrent()}if(a==='setTopMaterial'){state.top.material=b.dataset.id;return renderCurrent()}if(a==='sinkType'){state.top.sinkType=b.dataset.type;return renderCurrent()}if(a==='selectMaterial'){state.selectedMaterial=b.dataset.id;return renderCurrent()}if(a==='toggleImprove'){const i=state.improvements.find(x=>x.id===b.dataset.id);i.selected=!i.selected;return renderCurrent()}if(a==='addPayment'){return}if(a==='addExpense'){return}if(a==='measurePaid'){state.payments.unshift({id:uid('pay'),amount:state.settings.measurePrice,type:'замер',date:new Date().toISOString(),note:'зачесть при заказе'});toast('Замер отмечен как оплаченный');return renderCurrent()}if(a==='deletePayment'){state.payments=state.payments.filter(x=>x.id!==b.dataset.id);toast('Платёж удалён','warn');return renderCurrent()}if(a==='deleteExpense'){state.expenses=state.expenses.filter(x=>x.id!==b.dataset.id);toast('Расход удалён','warn');return renderCurrent()}if(a==='moneyDoc')return openModal('Финансовая сводка',docHtml('money'));if(a==='doc')return openModal({kp:'КП для клиента',meeting:'Сводка встречи',mount:'Пакет монтажника',money:'Финансовая сводка',acceptance:'Акт приёмки'}[b.dataset.doc],docHtml(b.dataset.doc));if(a==='snapshot'){const t=totals();state.versions.unshift({id:uid('ver'),name:`Версия ${state.versions.length+1}`,date:new Date().toISOString(),snapshot:clone(state),total:t.totalClient});toast('Слепок версии создан');return renderCurrent()}if(a==='restoreVersion'){const v=state.versions.find(x=>x.id===b.dataset.id);if(v&&confirm('Открыть эту версию? Текущие изменения будут заменены.')){const versions=state.versions;state=clone(v.snapshot);state.versions=versions;toast('Версия открыта');return renderCurrent()}}if(a==='deleteVersion'){state.versions=state.versions.filter(x=>x.id!==b.dataset.id);toast('Версия удалена','warn');return renderCurrent()}if(a==='newProject'){if(confirm('Очистить текущий проект?')){state=clone(DEFAULT);toast('Новый проект создан');return renderCurrent()}}if(a==='exportJson'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='AN_BAMO_project.json';link.click();URL.revokeObjectURL(link.href);return toast('JSON экспортирован')}if(a==='importJson')return document.getElementById('importFile').click();if(a==='matToggle'){const m=state.materials.find(x=>x.id===b.dataset.id);m[b.dataset.key]=!m[b.dataset.key];return renderCurrent()}if(a==='matRecommended'){state.materials.forEach(m=>m.recommended=false);const m=state.materials.find(x=>x.id===b.dataset.id);m.recommended=true;state.selectedMaterial=m.id;return renderCurrent()}if(a==='quickTaskClient'){state.tasks.push({id:uid('task'),side:'client',text:prompt('Что должен сделать клиент?','Купить ручки / уточнить модель техники')||'Задача клиента'});closeModal();return renderCurrent()}if(a==='quickTaskUs'){state.tasks.push({id:uid('task'),side:'us',text:prompt('Что должны сделать мы?','Подобрать вытяжку / уточнить цену')||'Задача AN BAMO'});closeModal();return renderCurrent()}if(a==='quickRisk'){const r=prompt('Риск / предупреждение','Старые корпуса могут быть кривыми');if(r)state.risks.push(r);closeModal();return renderCurrent()}});
document.addEventListener('input',e=>{const x=e.target;if(!x.dataset.bind)return;const bind=x.dataset.bind;if(bind.startsWith('zone:')){const [id,key]=bind.slice(5).split('.');const z=state.zones.find(v=>v.id===id);z[key]=['name','color'].includes(key)?x.value:num(x.value);renderHeader();markDirty();return}if(bind.startsWith('improvement:')){const [id,key]=bind.slice(12).split('.');const i=state.improvements.find(v=>v.id===id);i[key]=num(x.value);renderHeader();markDirty();return}if(bind.startsWith('material:')){const [id,key]=bind.slice(9).split('.');const m=state.materials.find(v=>v.id===id);m[key]=['price','cost'].includes(key)?num(x.value):x.value;renderHeader();markDirty();return}const [root,key]=bind.split('.');if(root==='project')state.project[key]=x.value;else if(root==='top')state.top[key]=['decor','material','sinkType'].includes(key)?x.value:num(x.value);else if(root==='settings')state.settings[key]=['company','measureText'].includes(key)?x.value:num(x.value);renderHeader();markDirty();});
document.addEventListener('change',e=>{if(e.target.dataset.bind)renderCurrent()});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{state=merge(DEFAULT,JSON.parse(r.result));toast('JSON импортирован');renderCurrent()}catch(err){toast('Ошибка импорта JSON','bad')}};r.readAsText(file);e.target.value=''});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))document.body.classList.add('input-focused')});document.addEventListener('focusout',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,textarea,select'))document.body.classList.remove('input-focused')},90)});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.ui.theme==='system')render()});
﻿const CAPTURE_TYPES=[
  {id:'facade',label:'Фасад',hint:'размер / фасад / модуль'},
  {id:'panel',label:'Панель / добор',hint:'панель, боковина, цоколь'},
  {id:'custom',label:'Нестандарт',hint:'ручная фиксация'},
  {id:'led',label:'LED',hint:'подсветка, блок, выключатель'},
  {id:'photo',label:'Фото',hint:'что сфотографировать'},
  {id:'note',label:'Заметка',hint:'обычная заметка'},
  {id:'taskClient',label:'Задача клиенту',hint:'что уточняет клиент'},
  {id:'taskUs',label:'Задача нам',hint:'что делает AN BAMO'},

function ensureMeasureState(){state.version='v10.4.3.1 Visual QA Fix';state.ui={...DEFAULT.ui,...(state.ui||{})};state.measure=merge(DEFAULT.measure,state.measure||{});state.measure.groups=state.measure.groups?.length?state.measure.groups:clone(DEFAULT.measure.groups);state.measure.capturedItems=state.measure.capturedItems||[];state.measure.activeGroup=state.measure.activeGroup||state.measure.groups[0]?.id||'lower'}
function escHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function typeLabel(id){return CAPTURE_TYPES.find(x=>x.id===id)?.label||id}
function groupLabel(id){ensureMeasureState();return state.measure.groups.find(x=>x.id===id)?.name||'Без группы'}
function render(){ensureMeasureState();applyTheme();renderHeader();document.querySelectorAll('.tab,.mobile-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.ui.tab));document.getElementById('moreBtn')?.classList.toggle('active',['improvements','docs','settings'].includes(state.ui.tab));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+state.ui.tab));renderRequest();renderFast();renderMeasure();renderImprovements();renderMoney();renderDocs();renderSettings();saveNow()}
function applyTheme(){ensureMeasureState();let theme=state.ui.theme;if(theme==='system')theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.body.dataset.theme=theme;document.body.dataset.contrast=state.ui.contrast;document.body.dataset.density=state.ui.density;document.body.dataset.glass=state.ui.glass?'on':'off';document.body.classList.toggle('tech',state.ui.tech);document.getElementById('themeBtn').textContent=state.ui.theme==='dark'?'🌙':state.ui.theme==='light'?'☀️':'◐';document.getElementById('modeBtn').textContent=state.ui.tech?'Технический':'Основной'}
function renderMeasure(){ensureMeasureState();const items=state.measure.capturedItems;const groups=state.measure.groups;document.getElementById('pane-measure').innerHTML=`<div class="layout"><div><div class="card"><div class="card-head"><div><div class="title">Замер</div><div class="subtitle">Полевой блокнот для точного замера. Подробный фасадный редактор остаётся точкой расширения, сейчас фиксируем группы, заметки, задачи, риски и платежи.</div></div><button class="btn primary" data-action="openCapture">+ Зафиксировать</button></div><div class="measure-groups">${groups.map(g=>`<button class="measure-group ${state.measure.activeGroup===g.id?'active':''}" data-action="setMeasureGroup" data-id="${g.id}"><b>${g.name}</b><small>${g.hint}</small><small>${items.filter(i=>i.groupId===g.id).length} записей</small></button>`).join('')}</div></div><div class="card"><div class="title">Быстрый каркас точного замера</div><div class="grid g2"><button class="btn" data-action="openCapture" data-type="facade">Фасад</button><button class="btn" data-action="openCapture" data-type="panel">Панель / добор</button><button class="btn" data-action="openCapture" data-type="custom">Нестандарт</button><button class="btn" data-action="openCapture" data-type="risk">Риск</button></div><div class="notice warn">Формулы быстрого КП не менялись. Здесь хранятся полевые записи для ТЗ, сводки встречи и будущего подробного редактора.</div></div></div><div><div class="card"><div class="title">Зафиксировано</div><div class="subtitle">Активная группа: ${groupLabel(state.measure.activeGroup)}</div><div class="row-list capture-list">${items.map(item=>`<div class="row-item"><div><div class="capture-type">${typeLabel(item.type)}</div><div class="meta">${groupLabel(item.groupId)} · ${new Date(item.date).toLocaleString('ru-RU')}</div><div class="capture-text">${escHtml(item.text)}</div></div><button class="btn sm red" data-action="deleteCapture" data-id="${item.id}">удалить</button></div>`).join('')||'<div class="empty">Пока нет записей. Нажми “+ Зафиксировать”.</div>'}</div></div><div class="card"><div class="title">Будущие точки расширения</div><div class="chip-row"><span class="chip">фасад</span><span class="chip">панель</span><span class="chip">нестандарт</span><span class="chip">LED</span><span class="chip">фото</span><span class="chip">заметка</span><span class="chip">задача</span><span class="chip">риск</span></div></div></div></div>`}
function fastHardwareSummary(){const doors=state.zones.reduce((a,z)=>a+num(z.doors),0);const drawers=drawersCount();const hinges=hingesCount();const handles=doors+drawers;return {doors,drawers,hinges,guides:drawers,handles,handleMode:state.audit.handlesClient?'клиент покупает сам':'мы подбираем'}}
function renderQuickImprovements(){const quickIds=['softHinges','drawerSoft','led','mdfLacquer','handlesHelp','disposal'];const cards=quickIds.map(id=>{const i=state.improvements.find(x=>x.id===id);if(!i)return '';const v=improvementValue(i);if(!v.visible)return '';return `<button class="quick-improve ${i.selected?'on':''}" data-action="toggleImprove" data-id="${i.id}"><b>${i.title}</b><small>${i.desc}</small><div class="price">+${money(v.sell)}</div></button>`}).join('');return `<div class="card optional-safe"><div class="title">Дополнительные улучшения</div><div class="subtitle">Быстрый выбор для разговора с клиентом. Полный список остаётся в разделе “Улучшения”.</div><div class="quick-improve-grid">${cards}</div><button class="btn soft" data-action="goTab" data-target="improvements">Все улучшения</button></div>`}
function renderFast(){ensureMeasureState();const t=totals();const h=fastHardwareSummary();document.getElementById('pane-fast').innerHTML=`<div class="layout"><div><div class="card"><div class="title">Быстрый расчёт по зонам</div><div class="subtitle">Что клиент запросил: ${state.project.want}. Для предКП по фото/звонку: длина × высота, двери, ящики, столешница.</div>${state.zones.map(z=>renderZone(z)).join('')}<button class="btn" data-action="addZone">+ Добавить зону</button></div><div class="card"><div class="title">Столешница</div><div class="subtitle">Материал, длина, вырезы и базовые проверки.</div><div class="chip-row"><button class="chip ${state.top.enabled?'active':''}" data-action="toggleTop">${state.top.enabled?'✓ ':''}Столешница нужна</button></div>${state.top.enabled?renderTop():''}</div><div class="card"><div class="title">Фурнитура / количество</div><div class="subtitle">Ориентир для быстрого КП. Точный подбор остаётся в Phase 2.</div><div class="hardware-mini"><div class="mini-card"><span>двери</span><b>${h.doors}</b></div><div class="mini-card"><span>петли ориентир</span><b>${h.hinges}</b></div><div class="mini-card"><span>ящики</span><b>${h.drawers}</b></div><div class="mini-card"><span>направляющие</span><b>${h.guides}</b></div><div class="mini-card"><span>ручки</span><b>${h.handles}</b></div><div class="mini-card"><span>режим ручек</span><b>${h.handleMode}</b></div></div><div class="chip-row" style="margin-top:10px"><button class="chip ${state.audit.handlesClient?'active':''}" data-action="toggleHandlesClient">Ручки: ${state.audit.handlesClient?'клиент сам':'мы подбираем'}</button></div></div></div><div><div class="card client-safe"><div class="title">Варианты фасадов для клиента</div><div class="subtitle">Не продаём “€/м²”. Показываем понятные варианты и итог за кухню.</div>${state.materials.filter(m=>m.active&&m.show).map(renderMaterialVariant).join('')}</div>${renderQuickImprovements()}<div class="card"><div class="title">Итого</div><div class="calc-split"><div class="summary-card"><span class="muted">Основное предложение</span><br><strong>${money(t.base.sell)}</strong></div><div class="summary-card"><span class="muted">Выбранные улучшения</span><br><strong>${money(t.improvements.sell)}</strong></div><div class="summary-card"><span class="muted">Итого клиенту</span><br><strong>${money(t.totalClient)}</strong></div><div class="summary-card"><span class="muted">Маржа</span><br><strong>${Math.round(t.margin)}%</strong></div></div></div></div></div>`}
function renderSettings(){ensureMeasureState();const topRows=Object.entries(state.topMaterials).map(([id,m])=>`<div class="card flat"><div class="grid g3"><div class="field"><label>Название</label><input data-top-material="${id}" data-field="name" value="${escHtml(m.name)}"></div><div class="field"><label>Цена клиенту €/м</label><input inputmode="decimal" data-top-material="${id}" data-field="price" value="${m.price}"></div><div class="field"><label>Себестоимость €/м</label><input inputmode="decimal" data-top-material="${id}" data-field="cost" value="${m.cost}"></div></div></div>`).join('');const improveRows=state.improvements.map(i=>`<div class="card flat"><div class="grid g2"><div class="field"><label>Название</label><input data-improve-setting="${i.id}" data-field="title" value="${escHtml(i.title)}"></div><div class="field"><label>Описание</label><input data-improve-setting="${i.id}" data-field="desc" value="${escHtml(i.desc)}"></div><div class="field"><label>Цена клиенту</label><input inputmode="decimal" data-improve-setting="${i.id}" data-field="price" value="${i.price}"></div><div class="field"><label>Себестоимость</label><input inputmode="decimal" data-improve-setting="${i.id}" data-field="cost" value="${i.cost}"></div></div></div>`).join('');document.getElementById('pane-settings').innerHTML=`<div class="card"><div class="title">Настройки</div><div class="subtitle">Доступны и с телефона через “Ещё”. Всё хранится локально, экспорт/импорт остаются JSON.</div><div class="section-title">Внешний вид</div><div class="chip-row"><button class="chip ${state.ui.theme==='system'?'active':''}" data-action="theme" data-value="system">Системная</button><button class="chip ${state.ui.theme==='light'?'active':''}" data-action="theme" data-value="light">Светлая</button><button class="chip ${state.ui.theme==='dark'?'active':''}" data-action="theme" data-value="dark">Тёмная</button><button class="chip ${state.ui.glass?'active':''}" data-action="glass">${state.ui.glass?'Glass включён':'Glass выключен'}</button><button class="chip ${state.ui.contrast==='high'?'active':''}" data-action="contrast">Высокая читаемость</button><button class="chip ${state.ui.density==='compact'?'active':''}" data-action="density">Компактнее</button><button class="chip ${state.ui.tech?'active':''}" data-action="toggleTech">Технический режим</button></div><div class="section-title">Компания / деньги / замер</div><div class="grid g3">${input('Компания','settings.company',state.settings.company)}${input('Замер, €','settings.measurePrice',state.settings.measurePrice)}${input('Аванс, %','settings.prepayPct',state.settings.prepayPct)}${input('Срок КП, дней','settings.validDays',state.settings.validDays)}${input('НДС / KM, %','settings.vat',state.settings.vat)}${input('Порог маржи, %','settings.marginWarn',state.settings.marginWarn)}</div>${textarea('Текст замера','settings.measureText',state.settings.measureText)}<div class="section-title">Экспорт / импорт</div><div class="toolbar"><button class="btn" data-action="exportJson">Экспорт JSON</button><button class="btn" data-action="importJson">Импорт JSON</button></div></div><div class="layout"><div class="card"><div class="title">Материалы фасадов</div>${state.materials.map(m=>`<div class="card flat"><div class="grid g2">${input('Клиентское название',`material:${m.id}.client`,m.client)}${input('Тех. название',`material:${m.id}.tech`,m.tech)}${input('Цена клиенту €/м²',`material:${m.id}.price`,m.price)}${input('Себестоимость €/м²',`material:${m.id}.cost`,m.cost)}</div><div class="toolbar" style="margin-top:10px"><button class="chip ${m.active?'active':''}" data-action="matToggle" data-id="${m.id}" data-key="active">активен</button><button class="chip ${m.show?'active':''}" data-action="matToggle" data-id="${m.id}" data-key="show">показывать в КП</button><button class="chip ${m.recommended?'active':''}" data-action="matRecommended" data-id="${m.id}">рекомендуемый</button></div></div>`).join('')}</div><div><div class="card"><div class="title">Столешницы</div>${topRows}</div><div class="card"><div class="title">Улучшения / услуги</div>${improveRows}</div></div></div>`}
function openMoreSheet(){openModal('Ещё',`<div class="grid g2 more-sheet"><button class="btn" data-action="goTab" data-target="improvements">Улучшения</button><button class="btn" data-action="goTab" data-target="docs">Документы</button><button class="btn" data-action="goTab" data-target="settings">Настройки</button><button class="btn" data-action="enableTech">Технический режим</button><button class="btn" data-action="exportJson">Экспорт JSON</button><button class="btn" data-action="importJson">Импорт JSON</button></div>`)}
function openCaptureSheet(preselect){ensureMeasureState();if(preselect)return addCapture(preselect);openModal('+ Зафиксировать',`<div class="grid g2 capture-actions">${CAPTURE_TYPES.map(t=>`<button class="btn" data-action="captureType" data-type="${t.id}"><span><b>${t.label}</b><br><small class="muted">${t.hint}</small></span></button>`).join('')}</div>`)}
function addCapture(type){ensureMeasureState();const meta=CAPTURE_TYPES.find(x=>x.id===type)||CAPTURE_TYPES[0];let text='';if(type==='payment'){const amount=num(state.settings.measurePrice)||40;state.payments.unshift({id:uid('pay'),amount,type:'платёж из замера',date:new Date().toISOString(),note:'добавлено через Замер'});text=`Платёж: ${money(amount)}`}else{text=`${meta.label}: ${meta.hint}`}const item={id:uid('cap'),type,groupId:state.measure.activeGroup,text:text.trim(),date:new Date().toISOString()};state.measure.capturedItems.unshift(item);if(type==='taskClient')state.tasks.push({id:uid('task'),side:'client',text:item.text});if(type==='taskUs')state.tasks.push({id:uid('task'),side:'us',text:item.text});if(type==='risk')state.risks.push(item.text);state.ui.tab='measure';closeModal();toast('Запись добавлена');renderCurrent()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.id==='moreBtn')return openMoreSheet();if(a==='openCapture')return openCaptureSheet(b.dataset.type);if(a==='captureType')return addCapture(b.dataset.type);if(a==='setMeasureGroup'){ensureMeasureState();state.measure.activeGroup=b.dataset.id;return renderCurrent()}if(a==='deleteCapture'){ensureMeasureState();state.measure.capturedItems=state.measure.capturedItems.filter(x=>x.id!==b.dataset.id);toast('Запись удалена','warn');return renderCurrent()}if(a==='goTab'){closeModal();return setTab(b.dataset.target)}if(a==='enableTech'){state.ui.tech=true;closeModal();toast('Технический режим включён');return setTab('money')}if(a==='toggleTech'){state.ui.tech=!state.ui.tech;return renderCurrent()}if(a==='glass'){state.ui.glass=!state.ui.glass;toast(state.ui.glass?'Glass включён':'Glass выключен');return renderCurrent()}})
document.addEventListener('input',e=>{const x=e.target;if(x.dataset.topMaterial){const m=state.topMaterials[x.dataset.topMaterial];if(m)m[x.dataset.field]=x.dataset.field==='name'?x.value:num(x.value);renderHeader();markDirty()}if(x.dataset.improveSetting){const i=state.improvements.find(v=>v.id===x.dataset.improveSetting);if(i)i[x.dataset.field]=['title','desc'].includes(x.dataset.field)?x.value:num(x.value);renderHeader();markDirty()}})
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.topMaterial||x.dataset.improveSetting)renderCurrent()})
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='toggleHandlesClient'){state.audit.handlesClient=!state.audit.handlesClient;toast(state.audit.handlesClient?'Ручки отмечены как покупка клиента':'Ручки отмечены как подбор AN BAMO');return renderCurrent()}})

function normalizeCatalogItem(item, id, fallbackName){item.client=item.client||item.name||item.title||fallbackName||id;item.tech=item.tech||id;item.price=num(item.price);item.cost=num(item.cost);if(item.active===undefined)item.active=true;if(item.show===undefined)item.show=true;return item}
function ensureV1043State(){ensureMeasureState();state.version='v10.4.3.1 Visual QA Fix';state.hardware={handlesMode:'we',handlesCount:0,...(state.hardware||{})};const neededZones=[{id:'lower',name:'Низ',color:'blue',len:state.zones?.find(z=>z.id==='lower')?.len??5,height:720,deduct:0,doors:state.zones?.find(z=>z.id==='lower')?.doors??8,drawers:state.zones?.find(z=>z.id==='lower')?.drawers??3},{id:'upper',name:'Верх',color:'green',len:state.zones?.find(z=>z.id==='upper')?.len??3,height:720,deduct:0,doors:state.zones?.find(z=>z.id==='upper')?.doors??5,drawers:0},{id:'tall',name:'Пенал',color:'purple',len:0,height:2100,deduct:0,doors:0,drawers:0},{id:'panels',name:'Панели',color:'amber',len:0,height:720,deduct:0,doors:0,drawers:0}];state.zones=state.zones||[];neededZones.forEach(z=>{if(!state.zones.some(x=>x.id===z.id))state.zones.push(z)});Object.entries(state.topMaterials||{}).forEach(([id,m])=>normalizeCatalogItem(m,id,m.name));state.hardwareCatalog=state.hardwareCatalog||{hinges:{client:'Петли',tech:'hinge',price:8,cost:3.2,active:true,show:true},runners:{client:'Направляющие',tech:'drawer runner',price:45,cost:24,active:true,show:true},handles:{client:'Ручки',tech:'handle',price:0,cost:0,active:true,show:true}};Object.entries(state.hardwareCatalog).forEach(([id,m])=>normalizeCatalogItem(m,id,m.client));state.servicesCatalog=state.servicesCatalog||{measure:{client:'Замер',tech:'field measure',price:state.settings.measurePrice,cost:0,active:true,show:true},dismantle:{client:'Демонтаж',tech:'dismantle',price:80,cost:30,active:true,show:true},delivery:{client:'Вывоз',tech:'removal',price:0,cost:0,active:true,show:true}};Object.entries(state.servicesCatalog).forEach(([id,m])=>normalizeCatalogItem(m,id,m.client));state.improvements.forEach(i=>{i.client=i.client||i.title;i.tech=i.tech||i.id;if(i.active===undefined)i.active=true;if(i.show===undefined)i.show=true;if(!i.status)i.status=i.selected?'included':i.mode==='recommend'?'recommend':'recommend';i.selected=i.status==='included'});state.audit.handlesClient=state.hardware.handlesMode==='client'}
function renderHeader(){ensureV1043State();const t=totals(),tr=traffic();document.getElementById('topSub').textContent=`${state.project.status} · ${state.project.client||'Новый проект'} · ${money(t.totalClient)}`;document.getElementById('bottomTotal').textContent=money(t.totalClient);const p=document.getElementById('trafficPill');p.className='pill '+tr.level;p.textContent='• '+tr.text}
function statusLabel(status){return status==='hidden'?'скрыто':status==='included'?'включено':'рекомендовать'}
function nextStatus(status){return status==='recommend'?'included':status==='included'?'hidden':'recommend'}
function setImproveStatus(id,status){const i=state.improvements.find(x=>x.id===id);if(!i)return;i.status=status;i.selected=status==='included';i.mode=status==='recommend'?'recommend':'optional';i.active=status!=='hidden';i.show=status!=='hidden'}
function fastHardwareSummary(){ensureV1043State();const doors=state.zones.reduce((a,z)=>a+num(z.doors),0);const drawers=drawersCount();const hinges=hingesCount();const estimateHandles=doors+drawers;return {doors,drawers,hinges,guides:drawers,estimateHandles,handles:num(state.hardware.handlesCount),handleMode:state.hardware.handlesMode}}
function handleModeLabel(mode){return mode==='client'?'клиент покупает сам':mode==='later'?'уточнить позже':'мы подберём'}
function flowTitle(n,title,sub=''){return `<div><span class="flow-index">${n}</span><span class="title">${title}</span>${sub?`<div class="subtitle">${sub}</div>`:''}</div>`}
function quoteZoneCard(z){return `<div class="zone ${z.color}"><div class="zone-head"><div><div class="zone-title">${z.name}</div><div class="zone-facts"><span class="mini">площадь ${(Math.max(0,num(z.len)*num(z.height)/1000-num(z.deduct))).toFixed(2)} м²</span><span class="mini">дверей ${z.doors}</span><span class="mini">петель ${z.doors*(z.height>900?3:2)}</span></div></div></div><div class="grid g2" style="margin-top:12px"><div>${input('Длина, м',`zone:${z.id}.len`,z.len,'0')}</div><div>${input('Высота, мм',`zone:${z.id}.height`,z.height,'720')}</div><div>${stepper('Двери','doors',z.doors,z.id)}</div><div>${stepper('Ящики','drawers',z.drawers,z.id)}</div></div></div>`}
function quickImproveCard(id){const i=state.improvements.find(x=>x.id===id);if(!i||i.status==='hidden')return '';const v=improvementValue(i);if(!v.visible)return '';return `<button class="quick-improve ${i.status==='included'?'on':''}" data-action="cycleImproveStatus" data-id="${i.id}"><b>${i.title}</b><small>${i.desc}</small><div class="price">+${money(v.sell)} · ${statusLabel(i.status)}</div></button>`}
function renderQuickImprovements(){const cards=['softHinges','drawerSoft','led','mdfLacquer','handlesHelp','disposal'].map(quickImproveCard).join('');return `<div class="card flow-card optional-safe"><div>${flowTitle(6,'Дополнительные улучшения','Не входят в базовую цену, пока клиент не подтвердил.')}</div><div class="quick-improve-grid">${cards}</div><button class="btn soft" data-action="goTab" data-target="improvements">Все улучшения</button></div>`}
function renderTop(){ensureV1043State();const available=Object.entries(state.topMaterials).filter(([,m])=>m.active!==false&&m.show!==false);const rows=(available.length?available:Object.entries(state.topMaterials)).map(([id,m])=>`<button class="chip ${state.top.material===id?'active':''}" data-action="setTopMaterial" data-id="${id}">${m.client||m.name}</button>`).join('');return `<div class="section-title">Материал</div><div class="chip-row">${rows}</div><div class="grid g3" style="margin-top:12px"><div>${input('Длина, м','top.len',state.top.len,'5')}</div><div>${input('Глубина, мм','top.depth',state.top.depth,'600')}</div><div>${input('Декор / цвет','top.decor',state.top.decor,'дуб / белый / ...')}</div></div><div class="grid g2" style="margin-top:12px"><div>${stepper('Вырез мойка','sinkCuts',state.top.sinkCuts,'top')}</div><div>${stepper('Вырез плита','hobCuts',state.top.hobCuts,'top')}</div></div><div class="section-title">Тип мойки</div><div class="chip-row"><button class="chip ${state.top.sinkType==='surface'?'active':''}" data-action="sinkType" data-type="surface">Накладная</button><button class="chip ${state.top.sinkType==='under'?'active':''}" data-action="sinkType" data-type="under">Подстольная</button></div>`}
function renderFast(){ensureV1043State();const t=totals();const h=fastHardwareSummary();document.getElementById('pane-fast').innerHTML=`<div class="fast-flow"><div class="card flow-card wide">${flowTitle(1,'Что клиент запросил','Основа предКП: запрос, клиент и комментарий менеджера.')}<div class="request-brief"><div class="summary-card"><span>клиент</span><strong>${state.project.client||'не указан'}</strong></div><div class="summary-card"><span>телефон</span><strong>${state.project.phone||'не указан'}</strong></div><div class="summary-card"><span>запрос</span><strong>${state.project.want}</strong></div></div><div class="grid g2" style="margin-top:12px"><div>${select('Что хочет клиент','project.want',state.project.want,['Только фасады','Фасады + столешница','Фасады + фурнитура','Полное обновление кухни'])}</div><div>${input('Клиент','project.client',state.project.client,'имя клиента')}</div></div>${textarea('Комментарий к предКП','project.comment',state.project.comment)}</div><div class="card flow-card wide">${flowTitle(2,'Зоны фасадов: низ / верх / пенал / панели','Только быстрый ориентир для предКП. Точный замер остаётся в разделе “Замер”.')}<div class="quote-zones">${state.zones.filter(z=>['lower','upper','tall','panels'].includes(z.id)).map(quoteZoneCard).join('')}</div><button class="btn" style="margin-top:12px" data-action="addZone">+ Добавить зону</button></div><div class="card flow-card client-safe">${flowTitle(3,'Варианты фасадов','Показываем итог за кухню, а не абстрактную цену за м².')} ${state.materials.filter(m=>m.active&&m.show).map(renderMaterialVariant).join('')}</div><div class="card flow-card">${flowTitle(4,'Фурнитура','Ориентир по количеству для разговора с клиентом.')}<div class="hardware-mini"><div class="mini-card"><span>двери</span><b>${h.doors}</b></div><div class="mini-card"><span>петли ориентир</span><b>${h.hinges}</b></div><div class="mini-card"><span>ящики</span><b>${h.drawers}</b></div><div class="mini-card"><span>направляющие</span><b>${ function saveMeasureDraft(mode){
  ensureV1044State();
  const d=normalizeMeasureDraft();
  const item={...d,id:d.editingId||uid('mi'),date:new Date().toISOString()};
  delete item.editingId;
  delete item.entryOpen;
  const idx=state.measureItems.findIndex(x=>x.id===item.id);
  if(idx>=0)state.measureItems[idx]=item;else state.measureItems.push(item);
  syncMeasureSideEffects(item);
  const next={...state.measureDraft,editingId:'',groupId:item.groupId,type:item.type,entryOpen:true};
  if(mode==='nextModule'){next.module=nextModuleName(item.module);next.position=`${next.module}.1`}
  else if(mode==='sameModule'){next.module=item.module;next.position=nextPositionForModule(item.module,item.groupId)}
  else if(mode==='stay'){next.position=item.position}
  else {next.module=item.module;next.position=nextPositionForModule(item.module,item.groupId)}
  state.measureDraft={...defaultMeasureDraft(),...next};
  state.measure.activeGroup=item.groupId;
  measureGroup(item.groupId).open=true;
  toast(idx>=0?'Позиция обновлена':'Позиция добавлена');
  renderCurrent();

(function(){

function moneySafeV4731(value){return typeof money==='function'?money(value):`${Math.round(num(value))} €`}
function improveByIdV4731(id){return (state.improvements||[]).find(i=>i.id===id)}
function statusRankV4731(status,selected){

}
function statusFromRankV4731(rank){return rank>=3?'included':rank>=2?'recommend':'hidden'}
function syncPriceSourcesV4731(){
  state.productionSettings=state.productionSettings||{};
  const laser=improveByIdV4731('laserEdging');
  if(laser){
    laser.title='Лазерная кромка по факту';

    laser.desc='Считается по длине кромки из замера: пог.м × цена из настроек.';
    laser.price=num(state.productionSettings.laserEdgingPrice);
    laser.cost=num(state.productionSettings.laserEdgingCost);
    laser.unit='edgeLm';
    laser.active=true;
    laser.show=true;
  }
  const lacquer=improveByIdV4731('extraLacquer');
  if(lacquer){
    lacquer.title='Усиленный лак MDF';
    lacquer.clientTitle='Усиленный лак MDF';
    lacquer.desc='Дополнительный слой лака для окрашенных MDF-фасадов. Считается от площади окрашенных деталей.';

    lacquer.unit='mdfArea';
    lacquer.active=true;
    lacquer.show=true;
  }
}
function dedupeLacquerV4731(){
  if(!Array.isArray(state.improvements))return;
  let legacy=improveByIdV4731('mdfLacquer');
  let canonical=improveByIdV4731('extraLacquer');
  if(legacy&&!canonical&&typeof upsertImprove==='function'){
    upsertImprove({
      id:'extraLacquer',
      icon:legacy.icon||'◈',
      title:'Усиленный лак MDF',
      desc:'Дополнительный слой лака для окрашенных MDF-фасадов. Считается от площади окрашенных деталей.',
      price:num(state.productionSettings?.extraLacquerPrice)||num(legacy.price),
      cost:num(state.productionSettings?.extraLacquerCost)||num(legacy.cost),
      unit:'mdfArea',
      selected:false,
      status:'recommend',
      active:true,
      show:true,
      clientTitle:'Усиленный лак MDF',
      techName:'extra lacquer'
    });
    canonical=improveByIdV4731('extraLacquer');
  }
  if(legacy&&canonical){
    const rank=Math.max(statusRankV4731(canonical.status,canonical.selected),statusRankV4731(legacy.status,legacy.selected));
    canonical.status=statusFromRankV4731(rank);
    canonical.selected=canonical.status==='included';
    canonical.mode=canonical.status==='recommend'?'recommend':'optional';
    canonical.active=true;
    canonical.show=true;
  }
  state.improvements=state.improvements.filter(i=>i.id!=='mdfLacquer');

const baseImproveValueV4731=improvementValue;

    const q=typeof edgeTotal==='function'?edgeTotal():0;
    const p=num(state.productionSettings?.laserEdgingPrice);
    const c=num(state.productionSettings?.laserEdgingCost);
    return {sell:q*p,cost:q*c,qty:q,visible:true};
  }
  if(i?.id==='extraLacquer'){
    const q=typeof paintedArea==='function'?paintedArea():0;
    const p=num(state.productionSettings?.extraLacquerPrice);
    const c=num(state.productionSettings?.extraLacquerCost);
    return {sell:q*p,cost:q*c,qty:q,visible:true};
  }
  return baseImproveValueV4731(i);
};
function formulaLineV4731(i,value){
  if(i.id==='laserEdging'){
    const price=num(state.productionSettings?.laserEdgingPrice);
    if(value.qty<=0)return '<div class="v4731-formula empty">Появится после позиций замера с включённой кромкой.</div>';
    return `<div class="v4731-formula"><b>Расчёт:</b> ${value.qty.toFixed(2)} пог.м × ${moneySafeV4731(price)} / пог.м = ${moneySafeV4731(value.sell)}</div>`;
  }
  if(i.id==='extraLacquer'){
    const price=num(state.productionSettings?.extraLacquerPrice);
    if(value.qty<=0)return '<div class="v4731-formula empty">Площадь появится после замера окрашенных MDF-деталей или быстрого расчёта MDF.</div>';
    return `<div class="v4731-formula"><b>Расчёт:</b> ${value.qty.toFixed(2)} м² × ${moneySafeV4731(price)} / м² = ${moneySafeV4731(value.sell)}</div>`;
  }
  return '';
}

}

  function passportBridge1413(){

  function zoneInheritHeight1413(zone){const p=passportBridge1413();return zone==='upper'?n1413(p.upperHeight):zone==='tall'?n1413(p.tallHeight):n1413(p.lowerHeight)}

  // Fields v10.4.13 owns on the draft. Older measure layers (v10.4.9 passport defaults at line ~3839)

  const CTRL_V1413=['hingeType','hardwareBrand','hingeCountMode','axisTemplate','axisMode','hingeAxisTop','hingeAxisBottom','hingeEdgeOffset','hingeEdgeSide','hingeOrientation','liftMechanism','liftDirection','decorName','colorName','ralCode','edgeType','finishType','textureDirection','painterNote','productionNote','cuttingNote','riskNote','comment','colorPending'];
  function ensureV1413(){
    if(typeof state!=='object')return state;

    const prev=state.measureDraft||{},ov=prev.overrides||{},saved={};

    state.measureUi.sectionsV1413=Object.assign({hinge:false,prod:false,notes:false,passport:false},state.measureUi.sectionsV1413||{});
    const p=passportBridge1413();
    const d=state.measureDraft=state.measureDraft||{};
    const adv=advancedDefaults1413();

    if(!d.editingId){

  },true);
